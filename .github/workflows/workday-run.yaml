name: Career Watcher Workday Run

on:
  # Started at :20 and :40 every hour by the Cloudflare Worker (cron-worker/); hourly-run.yaml covers :00.
  # Cloudflare in front of Workday blocks many GitHub runner IPs, and each run gets a new IP,
  # so extra Workday-only runs catch the companies an earlier run was blocked on.
  # No scoring here: the jobs are saved, and the next hourly run scores every unscored job on the board.
  workflow_dispatch:

jobs:
  run-workday:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
      TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
      # Workday requests go through cron-worker/workday-relay (Cloudflare challenges GitHub runner IPs)
      WORKDAY_RELAY_URL: ${{ vars.WORKDAY_RELAY_URL }}
      WORKDAY_RELAY_KEY: ${{ secrets.WORKDAY_RELAY_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Workday scraper
        run: node workday/workday.mjs
